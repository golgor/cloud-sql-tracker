[package]
name = "cloud-sql-tracker"
version = "0.1.1"
edition = "2021"
rust-version = "1.97.1"
description = "Control plane for multiple Google Cloud SQL Auth Proxy processes"
license = "MIT"
repository = "https://github.com/golgor/cloud-sql-tracker"
readme = "README.md"
keywords = ["cloud-sql", "proxy", "gcp", "omarchy"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
procfs = { version = "0.18", default-features = false }
# `time` feature only: `clock_gettime(ClockId::Monotonic)` for
# `commands::status`'s Unit-start-age math (`docs/research/supervisor-io.md`,
# "Use monotonic start time for Reconcile"). Already a transitive dependency
# of `zbus`/`procfs`; this adds no new crate to the tree.
# `time` for status Unit-start-age; `process` for doctor proxy -v timeout
# (kill the probe's process group so shell helpers die with the parent).
rustix = { version = "1", default-features = false, features = ["time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = "5.19.0"

[dev-dependencies]
# Layer 2 schema-shape proof only (docs/research/json-schema-crate.md);
# does not close #23. Kept out of normal deps.
jsonschema = { version = "0.50", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
