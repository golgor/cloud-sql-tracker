[package]
name = "cloud-sql-tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
description = "Control plane for multiple Google Cloud SQL Auth Proxy processes"
license = "MIT"
repository = "https://github.com/golgor/cloud-sql-tracker"
readme = "README.md"
keywords = ["cloud-sql", "proxy", "gcp", "omarchy"]
categories = ["command-line-utilities"]

[dependencies]
procfs = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = "5.19.0"
# clap lands with cli (#45).

[profile.release]
lto = true
codegen-units = 1
strip = true
