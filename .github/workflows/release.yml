# Build and attach a Linux x86_64 archive to a GitHub Release.
# Research: docs/research/release-build.md (issue #69).
# Does not run on pull_request or untagged main pushes.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "tag must start with v (got: $TAG)" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Pin the action SHA; toolchain version is RUST_VERSION (same as mise.toml / Cargo.toml / ci.yml).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-release-${{ hashFiles('Cargo.lock') }}

      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          PKG_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Cargo.toml version ($PKG_VERSION) does not match tag version ($TAG_VERSION)" >&2
            exit 1
          fi
          echo "version=$PKG_VERSION"

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          STAGE="$(mktemp -d)"
          ARCHIVE="cloud-sql-tracker-v${VERSION}-${TARGET}.tar.gz"
          BIN="target/release/cloud-sql-tracker"

          test -x "$BIN"
          cp "$BIN" "$STAGE/cloud-sql-tracker"
          cp LICENSE README.md "$STAGE/"

          tar -C "$STAGE" -czf "$ARCHIVE" cloud-sql-tracker LICENSE README.md
          sha256sum "$ARCHIVE" > SHA256SUMS

          echo "archive bytes: $(wc -c < "$ARCHIVE")"
          echo "binary bytes:  $(wc -c < "$BIN")"
          cat SHA256SUMS
          "$BIN" --version

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ARCHIVE="${{ steps.pack.outputs.archive }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$ARCHIVE" SHA256SUMS \
              --title "$TAG" \
              --generate-notes
          fi
