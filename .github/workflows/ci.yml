name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the action SHA; toolchain version is RUST_VERSION (same as mise.toml / Cargo.toml).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      # Compile gate only (issue #100): proves the crate still builds for a
      # macOS collaborator. `check` does not link, so this needs no Apple SDK.
      - name: Darwin compile gate
        run: cargo check --target aarch64-apple-darwin --all-targets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same version as mise.toml pipx:check-jsonschema.
      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.38.0

      - name: Contracts (Layer 1)
        run: scripts/validate-contracts.sh
