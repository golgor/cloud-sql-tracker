# Tool versions and thin task wrappers. Commands stay ordinary cargo / scripts.
# Rust 1.97.1 is the pin for mise, Cargo.toml rust-version, and CI together.

[tools]
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
hk = "1.56.0" # same as hk.pkl amends / min_hk_version
"pipx:check-jsonschema" = "0.38.0" # same as CI pip install

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check Rust formatting (non-mutating)"
run = "cargo fmt --check"

[tasks.lint]
description = "Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Default cargo test (never --include-ignored)"
run = "cargo test"

[tasks.contracts]
description = "Layer 1: goldens vs JSON Schemas"
run = "scripts/validate-contracts.sh"

[tasks.check]
description = "Full local gate (matches CI)"
run = [
  "mise run fmt-check",
  "mise run lint",
  "mise run test",
  "mise run contracts",
]

[tasks.build-release]
description = "Optimized release binary (same profile as GitHub Release)"
run = "cargo build --release --locked"

# Symlink keeps PATH pointed at this worktree's target/release binary after each rebuild.
[tasks.install-local]
description = "Build release and symlink into ~/.local/bin for PATH dogfood"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run build-release
mkdir -p "${HOME}/.local/bin"
ln -sfn "${PWD}/target/release/cloud-sql-tracker" "${HOME}/.local/bin/cloud-sql-tracker"
echo "linked ${HOME}/.local/bin/cloud-sql-tracker -> ${PWD}/target/release/cloud-sql-tracker"
"${HOME}/.local/bin/cloud-sql-tracker" --version
"""
